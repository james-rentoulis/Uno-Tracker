<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uno Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;1,900&display=swap">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14213d;--muted:#5d6b86;--line:#d5dbe7;--red:#e4312b;--yellow:#f7c600;--green:#2d9d4b;--blue:#1f5fbf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101626;--surface:#1a2238;--ink:#eef1f8;--muted:#9aa7c4;--line:#2d3757;--red:#ff5a52;--yellow:#ffd426;--green:#4cc36d;--blue:#5b94f0}}
:root[data-theme="dark"]{--bg:#101626;--surface:#1a2238;--ink:#eef1f8;--muted:#9aa7c4;--line:#2d3757;--red:#ff5a52;--yellow:#ffd426;--green:#4cc36d;--blue:#5b94f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:italic 900 clamp(40px,12vw,64px)/.95 Archivo,system-ui,sans-serif;letter-spacing:-.02em;margin:8px 0 4px;display:flex;gap:.08em;flex-wrap:wrap}
h1 span:nth-child(1){color:var(--red)}h1 span:nth-child(2){color:var(--yellow)}h1 span:nth-child(3){color:var(--green)}h1 span:nth-child(4){color:var(--blue)}
.sub{color:var(--muted);margin:0 0 24px}
h2{font-size:18px;margin:32px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.sm{padding:2px 8px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{border-radius:0;background:transparent;color:var(--muted);padding:8px 18px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:flex;align-items:center;gap:8px;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:6px 12px}
.chip.on{border-color:var(--blue);background:var(--surface)}
.chip.taken{opacity:.45}
.team{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.team .hd{display:flex;align-items:center;gap:8px}
.team .hd b{flex:1}
.team .chips{margin-bottom:0}
.place{min-width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:14px;background:var(--blue);color:#fff;font-weight:600}
.place.p1{background:var(--yellow);color:#14213d}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:14px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.elo{font-weight:900;font-size:18px}
.up{color:var(--green)}.down{color:var(--red)}
.wrap{overflow-x:auto}
.game{padding:12px 0;border-bottom:1px solid var(--line)}
.game:last-child{border-bottom:0}
.game .top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:4px}
.game .t{margin:2px 0}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:18px 0;margin:0}
details.card summary{cursor:pointer;font-weight:600}
details label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.rt{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
</style>
</head>
<body>
<main>
<h1><span>U</span><span>n</span><span>o</span><span>!</span></h1>
<p class="sub">Solo and team games, tracked with Elo.</p>
<p class="hint" id="sync" role="status"></p>

<h2>Players</h2>
<div class="card">
  <div class="row">
    <input id="name" placeholder="Player name" maxlength="20" autocomplete="off">
    <button id="add">Add player</button>
  </div>
</div>

<h2>Record a game</h2>
<div class="card">
  <div class="seg" id="mode"><button data-mode="solo">Solo</button><button data-mode="team">Teams</button></div>
  <p class="hint" id="hint"></p>
  <div id="entry"></div>
  <div class="row">
    <button id="addteam" class="ghost">Add team</button>
    <button id="record" disabled>Record game</button>
    <button class="ghost" id="clear">Clear</button>
  </div>
</div>

<h2>Leaderboard</h2>
<div class="card wrap" id="board"></div>

<h2>Game history</h2>
<div class="row" style="margin-bottom:10px;align-items:center"><label for="hfilter" style="color:var(--muted);font-size:14px">Show games for</label><select id="hfilter"></select></div>
<p class="hint" id="hsum"></p>
<div class="card" id="history"></div>

<h2>Sync</h2>
<details class="card" id="cfg"><summary>Sync settings</summary>
<label for="sy-url">Backend URL</label><input id="sy-url" placeholder="https://uno-ledger.your-name.workers.dev" autocomplete="off">
<label for="sy-pin">Scorer PIN (only if your backend has one)</label><input id="sy-pin" type="password" autocomplete="off">
<p class="hint" style="margin-top:12px">Anyone with the link can view scores. With a PIN set on the backend, only people who know it can record games.</p>
<button id="sy-save">Save and sync</button>
</details>

<h2>Reset</h2>
<button class="ghost" id="reset">Delete all data</button>
</main>

<script>
(function(){
var KEY="uno-ledger-v1", START=1000, K=32, MODES=["solo","team"];
var state={players:[],games:[]}, mode="solo", bmode="solo", sw=null, solo=[], draft=[[],[]];
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&p.players&&p.games)state=p;}}catch(e){}
// migrate older games: single-player teams are solo games
state.games.forEach(function(g){
  if(!g.teams){g.teams=(g.order||[]).map(function(id){return [id];});delete g.order;}
  if(!g.mode)g.mode=g.teams.every(function(t){return t.length===1;})?"solo":"team";
});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
// Published pages block confirm(), so destructive buttons ask for a second tap instead.
var armed=null,hf="";
function arm(key){if(armed===key){armed=null;return true;}armed=key;render();setTimeout(function(){if(armed===key){armed=null;render();}},4000);return false;}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function name(id){var p=state.players.find(function(x){return x.id===id});return p?p.name:"Removed player";}
function names(ids){return ids.map(function(id){return esc(name(id));}).join(" + ");}
function without(arr,id){return arr.filter(function(x){return x!==id;});}

// One Elo per player, shared by solo and team games. A team's rating is the average of its members; every pair
// of teams is a head-to-head scaled by K/(teams-1), and each member gets the full change.
// Solo games are the same thing with teams of one.
function compute(){
  var R={},S={},deltas=[];
  var r0={},s0={};state.players.forEach(function(p){r0[p.id]=START;s0[p.id]={g:0,w:0};});MODES.forEach(function(m){R[m]=r0;S[m]=s0;});
  state.games.forEach(function(g){
    var r=R[g.mode],st=S[g.mode],ent=[];
    g.teams.forEach(function(t,o){var f=t.filter(function(id){return id in r;});if(f.length)ent.push({o:o,t:f});});
    var n=ent.length,avg=ent.map(function(x){return x.t.reduce(function(a,id){return a+r[id];},0)/x.t.length;}),d=ent.map(function(){return 0;});
    for(var i=0;i<(g.mode==="solo"?1:n);i++)for(var j=i+1;j<n;j++){
      var e=1/(1+Math.pow(10,(avg[j]-avg[i])/400)),ch=K/(n-1)*(1-e);
      d[i]+=ch;d[j]-=ch;
    }
    var out=g.teams.map(function(){return null;});
    ent.forEach(function(x,i){out[x.o]={d:d[i],p:x.t.map(function(id){var b=r[id];r[id]+=d[i];st[id].g++;if(i===0)st[id].w++;return{id:id,b:b,a:r[id]};})};});
    deltas.push(out);
  });
  return{R:R,S:S,deltas:deltas};
}

function render(){
  var c=compute();
  Array.prototype.forEach.call(document.querySelectorAll("#mode button"),function(b){b.setAttribute("aria-pressed",b.dataset.mode===mode);});
  Array.prototype.forEach.call(document.querySelectorAll("#bmode button"),function(b){b.setAttribute("aria-pressed",b.dataset.bmode===bmode);});
  document.getElementById("hint").textContent=mode==="solo"?"Pick the winner, then everyone else who played. Only the winner’s rating is compared against the others.":"Tap players to put them on a team. Teams are listed in finishing order, winner first.";
  document.getElementById("addteam").style.display=mode==="team"?"":"none";
  document.getElementById("reset").textContent=armed==="reset"?"Tap again to delete everything":"Delete all data";
  var en=document.getElementById("entry"),ready;
  if(!state.players.length){en.innerHTML='<p class="empty">Add at least two players to start.</p>';ready=false;}
  else if(mode==="solo"){
    en.innerHTML='<p class="hint">Winner</p><div class="chips">'+state.players.map(function(p){var w=sw===p.id;return '<button class="chip'+(w?' on':'')+'" data-sw="'+p.id+'" aria-pressed="'+w+'">'+esc(p.name)+'</button>';}).join("")+'</div><p class="hint">Lost to them</p><div class="chips">'+state.players.map(function(p){
      var i=solo.indexOf(p.id);
      return '<button class="chip'+(i>=0?' on':'')+(sw===p.id?' taken':'')+'" data-spick="'+p.id+'" aria-pressed="'+(i>=0)+'">'+esc(p.name)+'</button>';
    }).join("")+'</div>';
    ready=!!sw&&solo.length>=1;
  } else {
    en.innerHTML=draft.map(function(t,ti){
      return '<div class="team"><div class="hd"><span class="place'+(ti===0?' p1':'')+'">'+(ti+1)+'</span><b>'+(ti===0?'Winners':'Place '+(ti+1))+'</b>'+
        '<button class="ghost sm" data-up="'+ti+'"'+(ti===0?' disabled':'')+'>Move up</button>'+
        '<button class="ghost sm" data-rmteam="'+ti+'"'+(draft.length<=2?' disabled':'')+'>Remove</button></div>'+
        '<div class="chips">'+state.players.map(function(p){
          var on=t.indexOf(p.id)>=0,el=!on&&draft.some(function(x){return x.indexOf(p.id)>=0;});
          return '<button class="chip'+(on?' on':'')+(el?' taken':'')+'" data-pick="'+ti+':'+p.id+'" aria-pressed="'+on+'">'+esc(p.name)+'</button>';
        }).join("")+'</div></div>';
    }).join("");
    ready=draft.filter(function(t){return t.length;}).length>=2;
  }
  document.getElementById("record").disabled=!ready;

  var R=c.R[bmode],S=c.S[bmode],rows=state.players.slice().sort(function(a,b){return R[b.id]-R[a.id];});
  document.getElementById("board").innerHTML=rows.length?'<table><thead><tr><th>Player</th><th class="n">Elo</th><th class="n">Wins</th><th class="n">Games</th><th></th></tr></thead><tbody>'+rows.map(function(p,i){
    var s=S[p.id],pct=s.g?Math.round(100*s.w/s.g)+"%":"–";
    return '<tr><td>'+(i+1)+'. '+esc(p.name)+'</td><td class="n elo">'+Math.round(R[p.id])+'</td><td class="n">'+s.w+' ('+pct+')</td><td class="n">'+s.g+'</td><td class="n"><button class="ghost sm" data-rm="'+p.id+'" aria-label="Remove '+esc(p.name)+'">'+(armed==="rm:"+p.id?"Tap to confirm":"Remove")+'</button></td></tr>';
  }).join("")+'</tbody></table>':'<p class="empty">No players yet. Add the first one above.</p>';

  var hsel=document.getElementById("hfilter"),hkey=state.players.map(function(p){return p.id+p.name;}).join("|");
  if(hf&&!state.players.some(function(p){return p.id===hf;}))hf="";
  if(hsel.dataset.k!==hkey){hsel.dataset.k=hkey;hsel.innerHTML='<option value="">All players</option>'+state.players.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>';}).join("");}
  hsel.value=hf;
  var hst=hf?c.S.solo[hf]:null;
  document.getElementById("hsum").textContent=hst?name(hf)+": "+hst.g+" games, "+hst.w+" wins, Elo "+Math.round(c.R.solo[hf]):"";
  var hs=state.games.map(function(g,gi){return{g:g,d:c.deltas[gi]};}).reverse().filter(function(o){return !hf||o.g.teams.some(function(t){return t.indexOf(hf)>=0;});});
  document.getElementById("history").innerHTML=hs.length?hs.map(function(o){
    var lines=o.g.teams.map(function(t,i){
      var e=o.d[i],tag="",who=names(t);if(e){var v=e.d;tag=' <span class="'+(v>=0?'up':'down')+'">'+(v>=0?'+':'−')+Math.abs(Math.round(v))+'</span>';who=e.p.map(function(q){return esc(name(q.id))+' <span class="rt">'+Math.round(q.b)+' → '+Math.round(q.a)+'</span>';}).join(" + ");}
      return '<div class="t">'+(o.g.mode==="solo"?(i===0?"Won: ":"Lost: "):(i+1)+". ")+who+tag+'</div>';
    }).join("");
    return '<div class="game"><div class="top"><span><span class="tag">'+(o.g.mode==="solo"?"Solo":"Teams")+'</span>'+new Date(o.g.t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})+'</span><button class="ghost sm" data-del="'+o.g.id+'">'+(armed==="del:"+o.g.id?"Tap to confirm":"Delete")+'</button></div>'+lines+'</div>';
  }).join(""):'<p class="empty">'+(state.games.length?"No games for this player yet.":"No games yet. Record one above.")+'</p>';
}

// ---- Shared storage: a small backend (worker.js) keeps one copy of the scores ----
var DEFAULTS={url:""};
var cfg={url:DEFAULTS.url,pin:""};
try{var cs=JSON.parse(localStorage.getItem("uno-sync-cfg")||"null");if(cs)Object.keys(cs).forEach(function(k){if(cs[k])cfg[k]=cs[k];});}catch(e){}
var pending=[],flushing=false,timer=null;
function setSync(t){var el=document.getElementById("sync");if(el)el.textContent=t;}
function api(){return cfg.url.replace(/\/+$/,"");}
function clean(st){st=st||{};st.players=Array.isArray(st.players)?st.players:[];st.games=Array.isArray(st.games)?st.games:[];return st;}
async function remoteGet(){
  var r=await fetch(api()+"/state",{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  var j=await r.json();
  return{state:clean(j.state),version:j.version};
}
async function remotePut(st,version){
  var h={"Content-Type":"application/json"};if(cfg.pin)h["X-Pin"]=cfg.pin;
  var r=await fetch(api()+"/state",{method:"PUT",headers:h,body:JSON.stringify({version:version,state:st})});
  return{ok:r.ok,status:r.status};
}
// Every change is re-applied to the latest shared copy, so two scorers don't overwrite each other.
function commit(fn){
  fn(state);save();render();
  if(!cfg.url)return;
  pending.push(fn);flush();
}
async function flush(){
  if(flushing)return;flushing=true;setSync("Saving…");
  try{
    while(pending.length){
      var fns=pending.slice(),ok=false;
      for(var a=0;a<4&&!ok;a++){
        var r=await remoteGet();fns.forEach(function(f){f(r.state);});
        var res=await remotePut(r.state,r.version);
        if(res.ok){ok=true;state=r.state;pending.splice(0,fns.length);}
        else if(res.status===401){pending.length=0;flushing=false;setSync("Not saved: enter the scorer PIN in Sync settings.");return;}
        else if(res.status!==409)throw new Error("HTTP "+res.status);
      }
      if(!ok)throw new Error("too many conflicts");
    }
    save();render();setSync("Saved");
  }catch(e){setSync("Couldn’t save ("+e.message+"). Changes are kept here and will retry.");}
  flushing=false;
}
async function poll(){
  if(!cfg.url||flushing)return;
  if(pending.length){flush();return;}
  try{
    var r=await remoteGet();state=r.state;save();render();
    setSync("Up to date at "+new Date().toLocaleTimeString([],{timeStyle:"short"}));
  }catch(e){setSync("Can’t reach the backend ("+e.message+")");}
}
async function connect(){
  if(!cfg.url){setSync("Local only. Open Sync settings to share scores.");return;}
  try{
    var r=await remoteGet();
    if(r.version===0&&(state.players.length||state.games.length)){
      var snap=JSON.parse(JSON.stringify(state));
      commit(function(st){if(!st.players.length&&!st.games.length){st.players=snap.players;st.games=snap.games;}});
    }else{state=r.state;save();render();setSync("Connected");}
  }catch(e){setSync("Can’t reach the backend ("+e.message+")");}
  if(!timer)timer=setInterval(poll,15000);
}
document.getElementById("sy-url").value=cfg.url;
document.getElementById("sy-pin").value=cfg.pin;
document.getElementById("sy-save").onclick=function(){
  cfg.url=document.getElementById("sy-url").value.trim();
  cfg.pin=document.getElementById("sy-pin").value.trim();
  try{localStorage.setItem("uno-sync-cfg",JSON.stringify(cfg));}catch(e){}
  connect();
};
document.addEventListener("visibilitychange",function(){if(!document.hidden)poll();});

function addPlayer(){
  var el=document.getElementById("name"),n=el.value.trim();
  if(!n)return;
  if(state.players.some(function(p){return p.name.toLowerCase()===n.toLowerCase();})){el.value="";return;}
  var np={id:uid(),name:n};commit(function(st){if(!st.players.some(function(x){return x.id===np.id;}))st.players.push(np);});el.value="";el.focus();
}
document.getElementById("add").onclick=addPlayer;
document.getElementById("name").onkeydown=function(e){if(e.key==="Enter")addPlayer();};
document.getElementById("addteam").onclick=function(){draft.push([]);render();};
document.getElementById("hfilter").onchange=function(){hf=this.value;render();};
document.getElementById("clear").onclick=function(){solo=[];sw=null;draft=[[],[]];render();};
document.getElementById("record").onclick=function(){
  var teams=mode==="solo"?(sw?[[sw]].concat(solo.map(function(id){return [id];})):[]):draft.filter(function(t){return t.length;});
  if(teams.length<2)return;
  var ng={id:uid(),t:Date.now(),mode:mode,teams:teams};commit(function(st){if(!st.games.some(function(x){return x.id===ng.id;}))st.games.push(ng);});bmode=mode;solo=[];sw=null;draft=[[],[]];render();
};
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t||t.disabled)return;
  var d=t.dataset;
  if(d.mode){mode=d.mode;render();}
  else if(d.bmode){bmode=d.bmode;render();}
  else if(d.sw){sw=sw===d.sw?null:d.sw;solo=without(solo,sw);render();}
  else if(d.spick){if(d.spick===sw)return;var i=solo.indexOf(d.spick);if(i>=0)solo.splice(i,1);else solo.push(d.spick);render();}
  else if(d.pick){
    var pr=d.pick.split(":"),ti=+pr[0],id=pr[1],was=draft[ti].indexOf(id)>=0;
    draft=draft.map(function(x){return without(x,id);});
    if(!was)draft[ti].push(id);
    render();
  }
  else if(d.up){var k=+d.up,tmp=draft[k-1];draft[k-1]=draft[k];draft[k]=tmp;render();}
  else if(d.rmteam){draft.splice(+d.rmteam,1);render();}
  else if(d.del){if(arm("del:"+d.del)){commit(function(st){st.games=st.games.filter(function(g){return g.id!==d.del;});});}}
  else if(d.rm){if(arm("rm:"+d.rm)){commit(function(st){st.players=st.players.filter(function(p){return p.id!==d.rm;});});solo=without(solo,d.rm);if(sw===d.rm)sw=null;draft=draft.map(function(x){return without(x,d.rm);});render();}}
});
document.getElementById("reset").onclick=function(){
  if(arm("reset")){commit(function(st){st.players=[];st.games=[];});solo=[];sw=null;draft=[[],[]];render();}
};
render();
connect();
})();
</script>
</body>
</html>
